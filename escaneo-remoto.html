<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escaneo remoto — BiblioNexo</title>

    <!--
      Página aparte del sistema principal, a propósito: esta es la que abre
      el enlace de escaneo remoto (ver ui-base.js, showQrRemotoModal), que NO
      exige iniciar sesión. No carga js/main.js ni nada del panel del
      personal — solo lo necesario para leer el token de la URL, comprobarlo,
      y agregar, reponer o consultar libros con él.

      Sí carga vendor/js/supabase.js (a diferencia de antes del 22 de agosto
      de 2026): esta página habla con la mayoría de la base por fetch() plano
      contra la API REST (ver el comentario de escaneo-remoto.js), pero avisar
      en vivo al mesón que se escaneó un libro (Realtime Broadcast) necesita
      el cliente de supabase-js — un canal de WebSocket no se puede abrir con
      fetch(). El cliente que arma escaneo-remoto.js es aparte del de
      supabase-init.js (el de la app CON sesión): nunca inicia sesión, así
      que no levanta el candado entre pestañas de gotrue-js que ese otro
      archivo documenta y esquiva.

      Misma Política de Seguridad de Contenido que index.html — ver ese
      archivo para la explicación completa. connect-src hacia Supabase y
      Open Library: la primera para validar el token y escribir el libro, la
      segunda para completar título y autor por ISBN. img-src hacia
      covers.openlibrary.org (ítem 11, "pulido, no urgente"): la lista de lo
      escaneado en esta página SÍ muestra la portada de cada libro, igual que
      el panel del personal — ver js/modules/portadas.js.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: https://covers.openlibrary.org;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://openlibrary.org;
      base-uri 'self';
      form-action 'self';
      object-src 'none'">

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Escaneo remoto de libros — Biblioteca Pública Municipal de Futrono.">

    <link rel="icon" href="icono-192x192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="icono-512x512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="icono-192x192.png">

    <link rel="stylesheet" href="/vendor/css/tailwind.css">
    <link rel="stylesheet" href="/vendor/css/fonts.css">
    <link rel="stylesheet" href="/vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="/src/assets/css/styles.css">
</head>
<body class="bg-patrimonio-lago font-sans text-stone-800 min-h-screen flex items-center justify-center p-4">

    <noscript>
        <div class="bg-patrimonio-card border border-stone-300 rounded-2xl max-w-sm w-full p-6 text-center">
            Esta página necesita JavaScript para funcionar.
        </div>
    </noscript>

    <main id="escaneo-remoto-app" tabindex="-1" aria-label="Escaneo remoto" class="w-full max-w-md">
        <div class="bg-patrimonio-card border border-stone-300 rounded-2xl shadow-2xl p-6 text-center">
            <i aria-hidden="true" class="fas fa-spinner fa-spin text-3xl text-patrimonio-madera"></i>
            <p class="text-sm text-stone-500 mt-3">Comprobando el enlace…</p>
        </div>
    </main>

    <script id="script-supabase" src="/vendor/js/supabase.js"></script>
    <script type="module" src="/src/js/escaneo-remoto.js"></script>
</body>
</html>
