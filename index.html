<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BiblioNexo — Biblioteca Municipal de Futrono</title>

    <!--
      Política de Seguridad de Contenido.

      Todo se sirve desde este mismo origen ('self'), salvo las excepciones
      declaradas: la API de Supabase y Open Library (portadas y datos de ISBN),
      más mosaicos de OpenStreetMap y el servicio público OSRM para planificar
      rutas del Bibliomóvil. Cualquier otro origen queda bloqueado por el navegador.
      Las etiquetas de las paradas nunca se envían al servicio de rutas: solo
      coordenadas explícitamente seleccionadas por el personal.

      Esto cierra el riesgo de cadena de suministro: antes se cargaban Tailwind,
      Supabase, Chart.js y FontAwesome desde CDN de terceros, así que si alguno
      de ellos era comprometido, se ejecutaba código arbitrario en un sistema
      municipal con datos personales de vecinos.

      IMPORTANTE: lo ideal es enviar esta política como CABECERA HTTP, no como
      meta. La cabecera permite además frame-ancestors y es más difícil de
      manipular. Ver LEEME.md, sección de publicación.

      script-src ya NO permite 'unsafe-inline'. Los manejadores onclick/onerror
      que quedaban se reemplazaron por addEventListener, y el guardia de
      arranque se movió a js/arranque.js. Eso significa que, aunque alguien
      lograra inyectar una etiqueta <script> o un atributo onclick en la página,
      el navegador se negaría a ejecutarlo.

      style-src sí conserva 'unsafe-inline', porque hay atributos style con
      valores calculados (los colores de las leyendas de los gráficos). Es un
      riesgo bastante menor: con CSS no se ejecuta código.

      OJO CON LO QUE NO ESTÁ AQUÍ: falta frame-ancestors a propósito.

      Algunas directivas solo funcionan como cabecera HTTP y el navegador las
      ignora cuando llegan por <meta>: frame-ancestors, sandbox, report-uri y
      report-to. Tenerlas escritas aquí es peor que no tenerlas, porque dan la
      impresión de una protección que no existe — y además el navegador lo
      reclama en la consola.

      La protección contra clickjacking se envía por cabecera, en
      vercel.json, que va en la raíz del proyecto y Vercel lee
      automáticamente al desplegar.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: https://covers.openlibrary.org https://*.tile.openstreetmap.org;
      manifest-src 'self';
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://openlibrary.org https://router.project-osrm.org;
      base-uri 'self';
      form-action 'self';
      object-src 'none'">

    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Sistema de gestión de préstamos de la Biblioteca Pública Municipal de Futrono.">

    <!-- Dirección canónica: la URL que el buscador debe guardar como la buena
         de esta página. Hoy `index.html` y `/` sirven lo mismo y ambas pueden
         aparecer enlazadas desde fuera (el manifest apunta a `/index.html`);
         sin esta etiqueta, eso son dos contenidos duplicados. La alternativa
         —etiqueta `robots` con `noindex` en `/index.html`— cortaría de raíz el
         acceso desde un buscador, que es justo lo que se quiere evitar, y
         `robots.txt` no sirve para esto: un archivo bloqueado no se quita del
         índice, solo deja de leerse.

         Los tokens de estas tres líneas los sustituye `senalesPublicas()` en
         vite.config.js al construir; ver ahí por qué el origen tiene que ser
         absoluto y cómo se cambia cuando el municipio entregue su dominio. -->
    <link rel="canonical" href="__ORIGEN__/">

    <!-- Vista previa al compartir el enlace (por ejemplo, en WhatsApp o Slack
         entre personal municipal). No afecta el buscador: eso ya lo cubre la
         etiqueta <title> y "description" de arriba.

         OJO: `og:url`, `og:image` y el `canonical` de arriba llevan URL
         ABSOLUTA a propósito. Open Graph no acepta rutas relativas: con
         `content="icono-512x512.png"` como estaba hasta octubre de 2026, la
         tarjeta de vista previa no salía en ninguna parte — el botón de
         compartir de WhatsApp, Slack o Facebook busca el recurso contra su
         propio dominio, no contra el nuestro. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BiblioNexo">
    <meta property="og:locale" content="es_CL">
    <meta property="og:url" content="__ORIGEN__/">
    <meta property="og:title" content="BiblioNexo — Biblioteca Municipal de Futrono">
    <meta property="og:description" content="Sistema de gestión de préstamos de la Biblioteca Pública Municipal de Futrono.">
    <meta property="og:image" content="__IMAGEN_SOCIAL__">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Tarjeta de BiblioNexo: el nombre del sistema y su resumen, «Préstamos, catálogo, reservas y Bibliomóvil, en un solo sistema», junto al ícono del libro tallado.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BiblioNexo — Biblioteca Municipal de Futrono">
    <meta name="twitter:description" content="Sistema de gestión de préstamos de la Biblioteca Pública Municipal de Futrono.">
    <meta name="twitter:image" content="__IMAGEN_SOCIAL__">
    <meta name="twitter:image:alt" content="Tarjeta de BiblioNexo: el nombre del sistema y su resumen, «Préstamos, catálogo, reservas y Bibliomóvil, en un solo sistema», junto al ícono del libro tallado.">

    <!-- Íconos. Todos con ruta absoluta: en Vercel la 404 propia se sirve en
         la URL que el visitante escribió mal, así que un `href="favicon.ico"`
         relativo pediría /lo/que/sea/favicon.ico y daría 404 otra vez. Con
         `base: './'` Vite deja intactas las rutas de `public/`, solo reescribe
         los assets que bundlea. -->
    <!--
      Datos estructurados (señal 8 de la auditoría de octubre de 2026: no había
      ni un `application/ld+json` en el proyecto).

      Por qué esto no choca con la Política de Seguridad de Contenido de arriba:
      un `<script type="application/ld+json">` es un bloque de datos, no un
      script ejecutable — el navegador nunca lo corre, solo lo expone como
      texto del documento, y por eso CSP (`script-src 'self'`, sin
      'unsafe-inline') no lo bloquea ni tiene por qué autorizarlo. Lo leen los
      robots que arman fichas del sitio.

      Los `@id` son absolutos y comparten origen con el `canonical`: así esta
      página y `/privacidad.html` describen la MISMA entidad (`#biblioteca`) en
      vez de inventar dos. Cambiar de dominio no requiere tocar nada acá: los
      tokens los resuelve `senalesPublicas()` en vite.config.js.

      A propósito NO van aquí la dirección ni el teléfono. `src/js/config.js`
      (`BIBLIOTECA`) tiene una dirección y un fono marcados en el propio
      comentario como «ajusta estos datos con los reales antes de producción»,
      y `README.md` documenta otros distintos — es decir: son de ejemplo.
      Publicar un dato de contacto de ejemplo en datos estructurados es peor que
      no publicarlo: los buscadores lo repiten y corrigen mal. Están en
      `pendientes-checklist.md` 🟠; cuando la biblioteca confirme los dos, se
      agregan y la prueba `pruebas/verificar-build.mjs` deja de exigir que
      falten.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Library", "GovernmentOrganization"],
          "@id": "__ORIGEN__/#biblioteca",
          "name": "Biblioteca Pública Municipal de Futrono N° 332 «Escritor Ramón Quichiyao Figueroa»",
          "alternateName": "Biblioteca Pública Municipal de Futrono",
          "url": "__ORIGEN__/",
          "logo": "__ORIGEN__/icono-512x512.png",
          "image": "__IMAGEN_SOCIAL__",
          "parentOrganization": {
            "@type": "GovernmentOrganization",
            "name": "Ilustre Municipalidad de Futrono"
          },
          "areaServed": {
            "@type": "City",
            "name": "Futrono",
            "containedInPlace": {
              "@type": "AdministrativeArea",
              "name": "Región de Los Ríos"
            }
          }
        },
        {
          "@type": "WebApplication",
          "@id": "__ORIGEN__/#sistema",
          "name": "BiblioNexo",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Cualquiera con navegador web",
          "url": "__ORIGEN__/",
          "inLanguage": "es-CL",
          "isAccessibleForFree": false,
          "description": "Sistema de gestión de préstamos, catálogo, lectores, reservas y rutas del Bibliomóvil de la Biblioteca Pública Municipal de Futrono. Uso interno del personal: el contenido requiere una cuenta municipal.",
          "featureList": [
            "Préstamos y devoluciones con lector de código de barras",
            "Catálogo con datos de Open Library por ISBN",
            "Reservas y avisos de vencimiento a lectores",
            "Planificador de rutas del Bibliomóvil",
            "Operación de mesón sin conexión"
          ],
          "provider": { "@id": "__ORIGEN__/#biblioteca" },
          "audience": {
            "@type": "Audience",
            "audienceType": "Personal de la Biblioteca Pública Municipal de Futrono"
          }
        }
      ]
    }
    </script>

    <!-- Sin `sizes` ni `type`: el .ico trae sus tallas dentro (16/24/32/48/64)
    y el navegador elige; `sizes="any"` es semántica de vector. -->
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" href="/icono-192x192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="/icono-512x512.png" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="/icono-192x192.png">

    <!-- Vite PWA inyecta un único /manifest.json durante el build. La fuente
         de verdad de su nombre, idioma, alcance e íconos está en vite.config.js. -->
    <meta name="theme-color" content="#7A431D">

    <!-- Recursos de la aplicación autoalojados; los servicios externos declarados en la CSP se usan solo cuando corresponde. -->
    <link rel="stylesheet" href="/vendor/css/fonts.css">
    <link rel="stylesheet" href="/vendor/css/fontawesome.min.css">
    <link rel="stylesheet" href="/src/assets/css/styles.css">

    <!-- Guardia de arranque. Va como módulo (deferido) y ANTES que main.js:
         el navegador ejecuta los módulos en orden de documento antes de
         DOMContentLoaded, así que la función de error y el vigía de 10 s ya
         existen cuando arranca la aplicación. Tiene que ser un módulo para
         que Vite lo empaquete: un script clásico que apunte a /src/ no se
         copia a dist/ y en producción daría 404 (ver pruebas/probar-interfaz.mjs). -->
    <script type="module" src="/src/js/arranque.js"></script>
</head>
<body class="bg-patrimonio-base font-sans text-stone-800">

    <main id="views-container" tabindex="-1" aria-label="Contenido principal" class="h-screen w-full bg-patrimonio-lago flex items-center justify-center">
        <i aria-hidden="true" class="fas fa-spinner fa-spin text-4xl text-patrimonio-madera"></i>
        <span class="sr-only">Cargando el sistema…</span>
    </main>

    <!-- Contenedor Global de Notificaciones -->
    <div id="toast-container" role="status" aria-live="polite" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

    <!-- Librerías autoalojadas. Sin integrity porque ya no hay tercero que verificar:
         los archivos se sirven desde el mismo origen que la aplicación. -->
    <!-- html5-qrcode ya no se carga aquí: pesa 368 KB y solo hace falta en el
         Mesón. Se pide al encender la cámara (ver js/modules/scanner.js). -->
    <script id="script-supabase" src="/vendor/js/supabase.js"></script>

    <!-- Módulo Principal -->
    <script id="script-app" type="module" src="/src/js/main.js"></script>
</body>
</html>
